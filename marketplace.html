<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealr – Missions et prestataires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fa;--ink:#16212e;--mute:#5d6b7e;--line:#d9dee7;--card:#fff;--blue:#1f4fd8;--blue-d:#173ba3;--sun:#ffc857;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
.logo i{display:inline-block;width:.62em;height:.62em;background:#f55a1f;border-radius:50%;margin-right:.3em}
.hbtns{display:flex;gap:8px}
.btn{border:1px solid var(--ink);background:#fff;border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--bg)}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.main:hover{background:var(--blue-d)}
.hero{padding:56px 0 28px}
h1{font-size:clamp(2rem,5.4vw,3.6rem);line-height:1.04;letter-spacing:-.03em;font-weight:800;max-width:15em}
.hero p{color:var(--mute);font-size:1.1rem;max-width:36em;margin:16px 0 28px}
.seg{display:inline-flex;background:#e7ebf2;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:10px 18px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(22,33,46,.18)}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 260px;border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;background:#fff}
.search select{border:1px solid var(--line);border-radius:var(--r);padding:13px 12px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.count{color:var(--mute);margin:20px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;padding-bottom:56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.card h3{font-size:1.1rem;line-height:1.2}
.sub{color:var(--mute);font-size:.92rem}
.badge{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:99px;background:#e6edff;color:var(--blue-d)}
.badge.ent{background:#fff1cc;color:#6b4a00}
.badge.par{background:#e3f4ea;color:#17613a}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:.82rem;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--mute)}
.desc{margin:0;font-size:.95rem}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);gap:8px}
.price{font-weight:700}
.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:14px;padding:24px;width:min(460px,94vw);box-shadow:0 20px 60px rgba(22,33,46,.35)}
dialog::backdrop{background:rgba(22,33,46,.5)}
dialog h2{font-size:1.4rem;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.92rem;margin:12px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
textarea{min-height:90px;resize:vertical}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
footer{border-top:1px solid var(--line);background:#fff;padding:20px 0;color:var(--mute);font-size:.9rem}
@media(max-width:560px){.hbtns{gap:6px}.hbtns .btn{padding:8px 11px;font-size:.88rem}}
.demo{font-size:.75rem;color:var(--mute);border:1px dashed var(--line);border-radius:99px;padding:1px 8px;margin-left:4px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="index.html" style="color:inherit;text-decoration:none"><i></i>Dealr</a>
    <div class="hbtns">
      <a class="btn sec" id="navAcc" href="connexion.html" style="text-decoration:none;color:inherit">Se connecter</a>
      <button class="btn main" id="openMission">Publier une mission</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Un besoin d’un côté, un savoir-faire de l’autre.</h1>
    <p>Particuliers, entreprises et freelances se trouvent directement. Publiez une mission ou proposez vos services, sans intermédiaire.</p>
    <div class="seg" role="group" aria-label="Que cherchez-vous ?">
      <button id="vPros" aria-pressed="true">Je cherche un prestataire</button>
      <button id="vMis" aria-pressed="false">Je cherche une mission</button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Métier, compétence, ville…" aria-label="Recherche">
      <select id="type" aria-label="Type"></select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Catégories"></div>
  </section>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">© 2026 Dealr. Tous droits réservés.</div></footer>

<dialog id="dForm">
  <form method="dialog" id="fForm">
    <h2 id="fTitle"></h2>
    <label for="f1" id="l1"></label><input id="f1" required>
    <label for="f2" id="l2"></label><input id="f2" required>
    <label for="f3">Catégorie</label><select id="f3"></select>
    <label for="f4" id="l4"></label><input id="f4" required>
    <label for="f5">Description</label><textarea id="f5" required></textarea>
    <div class="acts"><button type="button" class="btn" data-close>Annuler</button><button class="btn main">Publier</button></div>
  </form>
</dialog>

<dialog id="dContact">
  <form method="dialog" id="fContact">
    <h2 id="cTitle"></h2>
    <label for="c1">Votre email</label><input id="c1" type="email" required>
    <label for="c2">Votre message</label><textarea id="c2" required></textarea>
    <div class="acts"><button type="button" class="btn" data-close>Annuler</button><button class="btn main">Envoyer</button></div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script src="profils.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const CATS=["Développement","Design","Marketing","Rédaction","Vidéo","Conseil"];
const pros=(window.DEALR_PROS||[]).map(p=>Object.assign({demo:true},p));
const missions=[
 {title:"Refonte du site vitrine de mon restaurant",who:"Particulier",by:"Sophie M.",c:"Design",b:"1 200 €",d:"Sous 3 semaines",desc:"Site simple avec menu, photos et réservation en ligne."},
 {title:"Application mobile de suivi de livraisons",who:"Entreprise",by:"Transports Duval",c:"Développement",b:"8 000 – 12 000 €",d:"Sous 3 mois",desc:"Application pour les chauffeurs avec scan de colis et signature."},
 {title:"Vidéo de présentation de notre produit",who:"Entreprise",by:"Greenly Home",c:"Vidéo",b:"2 500 €",d:"Sous 1 mois",desc:"Vidéo de 90 secondes pour notre page d’accueil et les réseaux sociaux."},
 {title:"Rédaction de 10 articles de blog",who:"Entreprise",by:"Cabinet Lefèvre",c:"Rédaction",b:"1 500 €",d:"Sous 6 semaines",desc:"Articles de 1 000 mots sur le droit du travail, optimisés SEO."},
 {title:"Logo et charte graphique pour mon association",who:"Particulier",by:"Marc T.",c:"Design",b:"600 €",d:"Sous 2 semaines",desc:"Association sportive : logo, couleurs et modèles de documents."},
 {title:"Audit de notre stratégie d’acquisition",who:"Entreprise",by:"Lumio SAS",c:"Marketing",b:"3 000 €",d:"Sous 1 mois",desc:"Analyse de nos canaux payants et recommandations chiffrées."}
];
const COL=["#1f4fd8","#c2410c","#0f766e","#7c3aed","#be185d","#4d7c0f"];
let view="pros",cat="Toutes",type="Tous",q="";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const init=s=>s.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const color=s=>COL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const cls=t=>t==="Entreprise"?"ent":t==="Particulier"?"par":"";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2800)}

function setup(){
  $("#chips").innerHTML=["Toutes",...CATS].map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
  const opts=view==="pros"?["Tous","Freelance","Entreprise"]:["Tous","Entreprise","Particulier"];
  $("#type").innerHTML=opts.map(o=>`<option>${o}</option>`).join("");
  $("#type").value=type;
}
function render(){
  const s=q.toLowerCase();
  const list=(view==="pros"?pros:missions).filter(x=>{
    const kind=view==="pros"?x.t:x.who;
    const hay=(view==="pros"?[x.n,x.job,x.city,...(x.tags||[])]:[x.title,x.by,x.desc]).join(" ").toLowerCase();
    return (cat==="Toutes"||x.c===cat)&&(type==="Tous"||kind===type)&&hay.includes(s);
  });
  $("#count").textContent=`${list.length} ${view==="pros"?"prestataire":"mission"}${list.length>1?"s":""}`;
  $("#grid").innerHTML=list.length?list.map((x,i)=>view==="pros"?proCard(x,i):misCard(x,i)).join(""):
    `<div class="empty">Aucun résultat. Élargissez votre recherche ou publiez votre besoin.</div>`;
}
const proCard=(x,i)=>{const img=DealrAuth.safeImg(x.photo),nm=x.n||"?";return `<article class="card">
  <div class="top">${img?`<div class="av" style="background:url('${img}') center/cover"></div>`:`<div class="av" style="background:${color(nm)}">${esc(init(nm))}</div>`}
  <div><h3>${esc(nm)}${x.demo?'<span class="demo">exemple</span>':""}</h3><div class="sub">${esc(x.job||"")}</div></div></div>
  <div><span class="badge ${cls(x.t)}">${esc(x.t||"Freelance")}</span> <span class="sub">${esc(x.c||"")} · ${esc(x.city||"")}${x.dispo?" · "+esc(x.dispo):""}</span></div>
  <div class="tags">${(x.tags||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
  <div class="foot"><div><span class="price">${esc(x.p||"Sur devis")}</span><div class="sub">${+x.a?`★ ${+x.r} (${+x.a} avis)`:"Nouveau profil"}</div></div>
  <div style="display:flex;gap:6px"><a class="btn" href="prestataire.html?id=${encodeURIComponent(x.id||"")}" style="text-decoration:none;color:inherit">Voir le profil</a><button class="btn main" data-contact="${esc(nm)}">Contacter</button></div></div></article>`};
const misCard=(x,i)=>`<article class="card">
  <div><span class="badge ${cls(x.who)}">${x.who}</span> <span class="sub">${esc(x.c)} · ${esc(x.by)}</span></div>
  <h3>${esc(x.title)}</h3>
  <p class="desc">${esc(x.desc)}</p>
  <div class="foot"><div><span class="price">${esc(x.b)}</span><div class="sub">${esc(x.d)}</div></div>
  <button class="btn main" data-contact="${esc(x.by)}">Proposer mes services</button></div></article>`;

/* Navigation et filtres */
function setView(v){view=v;type="Tous";cat="Toutes";$("#vPros").setAttribute("aria-pressed",v==="pros");$("#vMis").setAttribute("aria-pressed",v==="missions");setup();render()}
$("#vPros").onclick=()=>setView("pros");
$("#vMis").onclick=()=>setView("missions");
$("#q").oninput=e=>{q=e.target.value;render()};
$("#type").onchange=e=>{type=e.target.value;render()};
$("#chips").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;cat=b.dataset.c;setup();render()};

/* Fiches : contact */
$("#grid").onclick=e=>{
  const b=e.target.closest("[data-contact]");if(!b)return;
  $("#cTitle").textContent=(view==="pros"?"Contacter ":"Répondre à ")+b.dataset.contact;
  $("#fContact").reset();$("#dContact").showModal();
};
$("#fContact").onsubmit=()=>toast("Message envoyé (démo : rien n’est réellement transmis).");

/* Formulaire de publication */
let mode="mission";
function openForm(m){
  mode=m;$("#fForm").reset();
  const mi=m==="mission";
  $("#fTitle").textContent="Publier une mission";
  $("#l1").textContent=mi?"Titre de la mission":"Nom ou nom d’entreprise";
  $("#l2").textContent=mi?"Votre nom ou entreprise":"Métier ou activité";
  $("#l4").textContent=mi?"Budget (ex. 1 500 €)":"Tarif (ex. 400 €/jour)";
  $("#f3").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
  $("#dForm").showModal();
}
$("#openMission").onclick=()=>openForm("mission");
$("#fForm").onsubmit=()=>{
  const v=id=>$(id).value.trim();
  if(mode==="mission"){
    missions.unshift({title:v("#f1"),who:"Particulier",by:v("#f2"),c:v("#f3"),b:v("#f4"),d:"À définir",desc:v("#f5")});
    setView("missions");toast("Mission publiée.");
  }
};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());

setup();render();

/* Profils des membres (base de données) + bouton de compte */
DealrAuth.listProfiles().then(list=>{if(!list.length)return;
  const ids=new Set(list.map(p=>p.id));
  for(let i=pros.length-1;i>=0;i--)if(ids.has(pros[i].id))pros.splice(i,1);
  pros.unshift(...list);if(view==="pros")render()});
DealrAuth.user().then(u=>{if(!u)return;const a=$("#navAcc");a.textContent="Mon profil";a.href="prestataire.html?id=moi"});
</script>
</body>
</html>
