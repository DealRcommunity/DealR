<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealr – Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--mute:#6b6b73;--line:#ececf0;--o:#f55a1f;--bub:#f2f2f5}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--ink);background:#fff;font:16px/1.5 Figtree,system-ui,sans-serif;display:flex;flex-direction:column;
 background-image:radial-gradient(55% 40% at 100% 0,#ffe3cf 0,transparent 70%),radial-gradient(45% 35% at 0 100%,#ecedff 0,transparent 70%);background-repeat:no-repeat}
body.wait main{visibility:hidden}
h1,h2,.logo{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.035em;font-weight:800;line-height:1.05}
em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:1.12em;color:var(--o)}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;width:100%}
header{flex:none}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-size:1.5rem;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:.62em;height:.62em;border-radius:50%;background:var(--o)}
nav{display:flex;gap:22px;font-weight:500}
nav a{text-decoration:none;color:var(--mute)}
nav a:hover,nav a[aria-current]{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;padding:11px 20px;font:600 .95rem Figtree,sans-serif;text-decoration:none;background:var(--ink);color:#fff;border:1.5px solid var(--ink);cursor:pointer}
.btn:hover{background:#2a2a2e}
.btn.out{background:#fff;color:var(--ink)}

main{flex:1;min-height:0;padding-bottom:22px}
.app{height:100%;min-height:520px;display:grid;grid-template-columns:340px 1fr;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 24px 60px rgba(60,30,10,.1),0 2px 6px rgba(60,30,10,.05)}

/* Liste des conversations */
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list h1{font-size:1.9rem;padding:24px 22px 14px}
.find{margin:0 16px 10px;display:flex;align-items:center;gap:8px;background:#f5f5f7;border-radius:14px;padding:0 12px}
.find input{border:0;background:none;outline:0;padding:11px 0;flex:1;min-width:0}
.find svg{color:var(--mute);flex:none}
.convs{overflow-y:auto;flex:1;padding:4px 8px 12px}
.cv{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:16px;padding:11px 12px;cursor:pointer}
.cv:hover{background:#f7f7f9}
.cv[aria-current=true]{background:#fff3ec}
.cv .t{flex:1;min-width:0}
.cv .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cv b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv time{font-size:.76rem;color:var(--mute);flex:none}
.cv .pv{font-size:.88rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cv.unread b,.cv.unread .pv{color:var(--ink);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--o);flex:none}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.9rem;flex:none;background:linear-gradient(135deg,#ff8a3d,var(--o)) center/cover}
.av.s{width:30px;height:30px;font-size:.66rem}
.none{padding:30px 22px;color:var(--mute);font-size:.95rem}
.none .btn{margin-top:14px}

/* Fil de discussion */
.thread{display:flex;flex-direction:column;min-height:0;min-width:0}
.th{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}
.th .t{flex:1;min-width:0}
.th b{display:block;font-size:1.08rem;line-height:1.2}
.th small{color:var(--mute)}
.back{display:none;border:0;background:#f5f5f7;border-radius:50%;width:38px;height:38px;cursor:pointer;flex:none;font-size:1.1rem}
.msgs{flex:1;overflow-y:auto;padding:22px 22px 8px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:.76rem;font-weight:600;color:var(--mute);background:#f5f5f7;border-radius:99px;padding:3px 12px;margin:12px 0 6px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:74%}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.row .av{visibility:hidden}
.row.last .av{visibility:visible}
.bub{background:var(--bub);border-radius:20px;padding:10px 15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.96rem}
.row:not(.me).last .bub{border-bottom-left-radius:6px}
.row.me .bub{background:var(--ink);color:#fff}
.row.me.last .bub{border-bottom-right-radius:6px}
.stamp{font-size:.72rem;color:var(--mute);margin:2px 4px 8px}
.stamp.me{align-self:flex-end}
.intro{margin:auto;text-align:center;color:var(--mute);max-width:24em;padding:20px}
.intro .av{width:72px;height:72px;margin:0 auto 12px;font-size:1.3rem}
.intro b{display:block;color:var(--ink);font-size:1.15rem}

/* Réponses rapides et saisie */
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:8px 22px 0;justify-content:flex-end}
.quick button{border:1.5px solid var(--ink);background:#fff;border-radius:99px;padding:6px 14px;font-size:.88rem;font-weight:600;cursor:pointer}
.quick button:hover{background:var(--ink);color:#fff}
.comp{display:flex;gap:10px;align-items:flex-end;padding:12px 18px 18px}
.comp textarea{flex:1;border:1px solid #e3e3e8;background:#fafafb;border-radius:22px;padding:12px 16px;resize:none;max-height:140px;min-height:48px;line-height:1.4}
.comp textarea:focus{outline:0;border-color:var(--ink);background:#fff}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--o);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.send:disabled{background:#f3b79c;cursor:default}
.err{color:#c0270f;font-size:.86rem;padding:0 22px}
.pick{margin:auto;text-align:center;color:var(--mute);padding:30px}
.pick h2{color:var(--ink);font-size:2rem;margin-bottom:8px}

@media(max-width:820px){
 nav .hide{display:none}
 .wrap.m{padding:0}
 main{padding-bottom:0}
 .app{grid-template-columns:1fr;border-radius:0;box-shadow:none;min-height:0}
 .app.open .list{display:none}
 .app:not(.open) .thread{display:none}
 .back{display:grid;place-items:center}
 .row{max-width:86%}
}
</style>
</head>
<body class="wait">
<header><div class="wrap"><a class="logo" href="index.html"><i></i>Dealr</a>
<nav><a class="hide" href="marketplace.html">Marketplace</a><a href="messages.html" aria-current="page">Messages</a><a href="prestataire.html?id=moi">Mon profil</a></nav></div></header>

<main class="wrap m">
  <div class="app" id="app">
    <section class="list" aria-label="Conversations">
      <h1>Messages</h1>
      <label class="find"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="find" type="search" placeholder="Rechercher" aria-label="Rechercher une conversation"></label>
      <div class="convs" id="convs"></div>
    </section>

    <section class="thread" aria-label="Discussion">
      <div class="pick" id="pick"><h2>Vos <em>échanges.</em></h2><p>Choisissez une conversation, ou contactez un prestataire depuis la marketplace.</p></div>
      <div class="th" id="th" hidden>
        <button class="back" id="back" type="button" aria-label="Retour aux conversations">←</button>
        <div class="av" id="thAv"></div>
        <div class="t"><b id="thName"></b><small id="thJob"></small></div>
        <a class="btn out" id="thProfile" href="#" style="padding:8px 16px;font-size:.88rem">Voir le profil</a>
      </div>
      <div class="msgs" id="msgs" hidden aria-live="polite"></div>
      <div class="quick" id="quick" hidden></div>
      <p class="err" id="err" role="alert"></p>
      <form class="comp" id="comp" hidden>
        <textarea id="txt" rows="1" placeholder="Écrire un message…" aria-label="Votre message" maxlength="2000"></textarea>
        <button class="send" id="send" type="submit" aria-label="Envoyer" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
    </section>
  </div>
</main>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
var A=window.DealrAuth,$=function(i){return document.getElementById(i)};
var me=null,convs=[],cur=null,lastSig="";
var QUICK=["Bonjour, êtes-vous disponible ?","Pouvez-vous m’envoyer un devis ?","Merci, c’est parfait !"];
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function initials(n){return String(n||"?").split(" ").map(function(w){return w[0]||""}).slice(0,2).join("").toUpperCase()}
function avatar(p,cls){var a=h("div","av"+(cls?" "+cls:""));var img=A.safeImg(p&&p.photo);if(img)a.style.backgroundImage="url('"+img+"')";else a.textContent=initials(p&&p.n);return a}
function day(d){var t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return"Aujourd’hui";if(d.toDateString()===y.toDateString())return"Hier";
  return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function hm(d){return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function short(s){var d=new Date(s);if(isNaN(d))return"";return d.toDateString()===new Date().toDateString()?hm(d):d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}

/* Liste */
function renderList(){
  var box=$("convs"),f=$("find").value.toLowerCase().trim();box.textContent="";
  var list=convs.filter(function(c){return !f||String(c.other.n).toLowerCase().indexOf(f)>=0});
  if(!convs.length){var n=h("div","none","Aucune conversation pour le moment. Trouvez un prestataire et cliquez sur « Contacter ».");
    var a=h("a","btn","Parcourir la marketplace");a.href="marketplace.html";n.appendChild(h("br"));n.appendChild(a);box.appendChild(n);return}
  if(!list.length){box.appendChild(h("div","none","Aucun résultat."));return}
  list.forEach(function(c){
    var b=h("button","cv"+(c.unread?" unread":""));b.type="button";b.setAttribute("aria-current",cur&&cur.id===c.id?"true":"false");
    var t=h("span","t"),r1=h("span","r1");r1.appendChild(h("b","",c.other.n));r1.appendChild(h("time","",short(c.updatedAt)));
    t.appendChild(r1);t.appendChild(h("span","pv",c.lastText?(c.lastMine?"Vous : ":"")+c.lastText:"Nouvelle conversation"));
    b.appendChild(avatar(c.other));b.appendChild(t);if(c.unread)b.appendChild(h("span","dot"));
    b.onclick=function(){select(c.id,true)};box.appendChild(b)})}
function loadList(){return A.listConversations().then(function(l){convs=l;renderList();return l})}

/* Fil */
function select(id,push){
  cur=convs.filter(function(c){return c.id===id})[0];if(!cur)return;
  if(push)history.replaceState(null,"","messages.html?c="+encodeURIComponent(id));
  $("app").classList.add("open");$("pick").hidden=true;["th","msgs","comp"].forEach(function(k){$(k).hidden=false});
  var av=$("thAv"),na=avatar(cur.other);av.replaceWith(na);na.id="thAv";
  $("thName").textContent=cur.other.n;$("thJob").textContent=cur.other.job||"Membre Dealr";
  $("thProfile").href="prestataire.html?id="+encodeURIComponent(cur.other.id||"");
  lastSig="";$("err").textContent="";renderList();loadThread(true);
  A.markRead(id).then(function(){cur.unread=false;renderList();A.messagesLink(document.querySelector("nav a[aria-current]"))});
  setTimeout(function(){$("txt").focus()},50)}
function loadThread(scroll){
  if(!cur)return Promise.resolve();var id=cur.id;
  return A.listMessages(id).then(function(ms){
    if(!cur||cur.id!==id)return;
    var sig=ms.length+":"+(ms.length?ms[ms.length-1].id:"");if(sig===lastSig)return;lastSig=sig;
    var box=$("msgs"),atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.textContent="";
    if(!ms.length){var it=h("div","intro");it.appendChild(avatar(cur.other));it.appendChild(h("b","",cur.other.n));
      it.appendChild(h("p","","Présentez votre besoin, posez vos questions, convenez d’un prix. Tout se négocie ici."));box.appendChild(it)}
    var lastDay="";
    ms.forEach(function(m,i){
      var d=new Date(m.created_at),dk=d.toDateString(),mine=m.sender===me,next=ms[i+1];
      if(dk!==lastDay){box.appendChild(h("div","day",day(d)));lastDay=dk}
      var last=!next||next.sender!==m.sender||new Date(next.created_at).toDateString()!==dk;
      var r=h("div","row"+(mine?" me":"")+(last?" last":""));
      if(!mine)r.appendChild(avatar(cur.other,"s"));
      r.appendChild(h("div","bub",m.text));box.appendChild(r);
      if(last)box.appendChild(h("div","stamp"+(mine?" me":""),hm(d)))});
    if(scroll||atEnd)box.scrollTop=box.scrollHeight;
    var q=$("quick");q.textContent="";q.hidden=ms.length>2;
    QUICK.forEach(function(t){var b=h("button","",t);b.type="button";b.onclick=function(){$("txt").value=t;sync();$("txt").focus()};q.appendChild(b)});
  })}

/* Envoi */
function sync(){var t=$("txt");$("send").disabled=!t.value.trim();t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"}
$("txt").addEventListener("input",sync);
$("txt").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("comp").requestSubmit()}});
$("comp").onsubmit=function(e){e.preventDefault();var t=$("txt").value;if(!t.trim()||!cur)return;
  $("send").disabled=true;$("err").textContent="";
  A.sendMessage(cur.id,t).then(function(){$("txt").value="";sync();return loadThread(true)}).then(loadList)
   .catch(function(err){$("err").textContent="Message non envoyé : "+A.message(err);sync()})};
$("back").onclick=function(){$("app").classList.remove("open");cur=null;history.replaceState(null,"","messages.html");renderList()};
$("find").oninput=renderList;

/* Mise à jour régulière (nouveaux messages) */
function refresh(){if(document.hidden)return;loadList().then(function(){if(cur)loadThread(false)})}
setInterval(refresh,4000);
window.addEventListener("storage",refresh);

/* Démarrage : ?with=<profil> ouvre (ou crée) la conversation, ?c=<id> rouvre une conversation, &text= pré-remplit */
A.requireUser("messages.html"+location.search).then(function(u){
  me=u.id;var p=new URLSearchParams(location.search),w=p.get("with"),c=p.get("c"),txt=p.get("text");
  var start=w?A.getProfile(w).then(function(prof){if(!prof)throw new Error("not_found");return A.openConversation(prof)}):Promise.resolve(c);
  return start.catch(function(err){$("err").textContent=A.message(err);return null}).then(function(id){
    return loadList().then(function(){
      document.body.classList.remove("wait");
      if(id)select(id,true);
      if(id&&txt){$("txt").value=txt.slice(0,2000);sync()}
    })})});
})();
</script>
</body>
</html>
