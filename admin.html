<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealr – Administration</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--mute:#6b6b73;--line:#ececf0;--o:#f55a1f;--g:#22a863;--red:#c0270f;--ind:#3b4a9e}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);background:#f7f7f9;font:16px/1.5 Figtree,system-ui,sans-serif}
body.wait main{visibility:hidden}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.035em;font-weight:800;line-height:1.05}
em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:1.12em;color:var(--o)}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}
header{background:#fff;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-size:1.45rem;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:.62em;height:.62em;border-radius:50%;background:var(--o)}
.pill{background:var(--ink);color:#fff;border-radius:99px;padding:3px 10px;font-size:.74rem;font-weight:700}
nav{display:flex;gap:20px;font-weight:500;align-items:center}
nav a{text-decoration:none;color:var(--mute)}
nav a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;padding:10px 18px;font:600 .92rem Figtree,sans-serif;text-decoration:none;background:var(--ink);color:#fff;border:1.5px solid var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:#2a2a2e}
.btn.out{background:#fff;color:var(--ink)}.btn.out:hover{background:#f3f3f6}
.btn.pay{background:var(--o);border-color:var(--o)}.btn.pay:hover{background:#e04a12}
.btn.sm{padding:6px 13px;font-size:.84rem}
.btn[disabled]{opacity:.55;cursor:wait}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:30px 0 18px}
h1{font-size:clamp(2rem,4vw,2.8rem)}
.sub{color:var(--mute);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border-radius:18px;padding:14px 16px;border:1px solid var(--line)}
.stat b{display:block;font:800 1.7rem "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin-top:2px}
.stat.alert{border-color:#f3c2bb;background:#fff7f6}.stat.alert b{color:var(--red)}
.cn{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--red);color:#fff;font-size:.72rem;margin-left:8px;padding:0 6px}

.board{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start;padding-bottom:40px}
.panel{background:#fff;border-radius:22px;border:1px solid var(--line);overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{flex:1 1 auto;border:0;background:none;border-radius:12px;padding:8px 10px;font-weight:600;color:var(--mute);cursor:pointer;font-size:.9rem}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.tabs .n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:99px;background:var(--red);color:#fff;font-size:.7rem;margin-left:5px;padding:0 5px}
.find{margin:10px;display:flex;align-items:center;gap:8px;background:#f5f5f7;border-radius:12px;padding:0 12px}
.find input{border:0;background:none;outline:0;padding:10px 0;flex:1;min-width:0}
.list{max-height:calc(100vh - 330px);min-height:240px;overflow-y:auto;padding:0 8px 10px}
.it{display:block;width:100%;text-align:left;border:0;background:none;border-radius:14px;padding:12px;cursor:pointer;border-bottom:1px solid var(--line)}
.it:hover{background:#f7f7f9}
.it[aria-current=true]{background:#fff3ec}
.it .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.it b{display:block;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .who{font-size:.84rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .amt{font-weight:800;font-family:"Bricolage Grotesque",sans-serif}
.empty{padding:26px 16px;color:var(--mute);text-align:center}

.st{font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:99px;background:#f3f3f6;color:var(--mute);white-space:nowrap}
.s-proposed{background:#fff1cc;color:#6b4a00}.s-accepted,.s-delivered{background:#eef0ff;color:#2d3a8c}
.s-funded{background:#fff1e8;color:#b13d0d}.s-released{background:#e3f4ea;color:#17613a}.s-disputed{background:#fde8e6;color:#a1230f}.s-refunded{background:#eef0ff;color:#2d3a8c}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--ink);color:#fff;border-radius:99px;padding:3px 10px;font-size:.7rem;font-weight:800;letter-spacing:.06em}
.tag:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--o)}

.detail{padding:22px}
.pick{padding:60px 20px;text-align:center;color:var(--mute)}
.pick h2{color:var(--ink);font-size:1.8rem;margin-bottom:8px}
.dh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.back{display:none;border:0;background:#f3f3f6;border-radius:50%;width:36px;height:36px;cursor:pointer}
.big{font:800 2.6rem "Bricolage Grotesque",sans-serif;letter-spacing:-.045em;margin:12px 0 2px;line-height:1}
.ttl{font-weight:600;font-size:1.1rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.box{border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.box h3{font-size:1.02rem;margin-bottom:10px;letter-spacing:-.02em}
.party{display:flex;align-items:center;gap:10px;padding:8px 0}
.party+.party{border-top:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.82rem;flex:none;background:linear-gradient(135deg,#ff8a3d,var(--o)) center/cover}
.party .t{flex:1;min-width:0}
.party b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.9rem}
.tl li{display:flex;justify-content:space-between;gap:10px}
.tl li span:last-child{color:var(--mute);white-space:nowrap}
.tl li.red{color:var(--red);font-weight:600}
.motif{margin-top:16px;border:1.5px solid #f3c2bb;background:#fff7f6;border-radius:16px;padding:12px 15px}
.motif b{color:#a1230f}
.motif p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.dec{margin-top:16px;border:2px solid var(--ink);border-radius:18px;padding:16px}
.dec h3{font-size:1.15rem;margin-bottom:4px}
label{display:block;font-weight:600;font-size:.86rem;margin:12px 0 5px}
textarea{width:100%;border:1px solid #e3e3e8;border-radius:12px;padding:11px 13px;background:#fafafb;min-height:84px;resize:vertical}
textarea:focus{outline:0;border-color:var(--ink);background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1 1 auto}
.ok{color:#17613a;font-size:.88rem;min-height:1.2em;margin:8px 0 0}
.err{color:var(--red);font-size:.88rem;min-height:1.2em;margin:8px 0 0}
.done{margin-top:16px;border-radius:16px;padding:14px 16px;background:#e3f4ea;color:#17613a;font-weight:600}
.done.refd{background:#eef0ff;color:#2d3a8c}

/* Conversation en lecture */
.thread{margin-top:16px}
.msgs{max-height:520px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:14px;background:#fafafb;border-radius:16px;border:1px solid var(--line)}
.m{max-width:78%}
.m.r{align-self:flex-end;text-align:right}
.m small{display:block;color:var(--mute);font-size:.74rem;margin:6px 4px 2px}
.bub{display:inline-block;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:9px 13px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.m.r .bub{background:var(--ink);color:#fff;border-color:var(--ink)}
.ev{align-self:center;font-size:.8rem;color:var(--mute);text-align:center;margin:4px 0}
.ev b{color:var(--ink)}
.ev.deal{background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:6px 12px;color:var(--ink)}
.adm{align-self:center;width:min(440px,100%);background:#eef0ff;border:1.5px solid #c9cff5;border-radius:14px;padding:10px 13px;margin:6px 0;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.adm b{display:block;color:#2d3a8c;font-size:.8rem}
.day{align-self:center;font-size:.74rem;font-weight:600;color:var(--mute);background:#ececf0;border-radius:99px;padding:2px 10px;margin:8px 0 4px}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--mute);margin:6px 0 8px;flex-wrap:wrap}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:#fff;border:1px solid #d6d6dd}
.legend span.r:before{background:var(--ink);border-color:var(--ink)}

dialog{border:0;border-radius:22px;padding:24px;width:min(440px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(17,17,17,.45)}
dialog h2{font-size:1.5rem;margin-bottom:8px}
.denied{max-width:520px;margin:80px auto;background:#fff;border-radius:22px;padding:30px;text-align:center;border:1px solid var(--line)}
.denied h1{font-size:2rem;margin-bottom:10px}

@media(max-width:980px){
 .stats{grid-template-columns:1fr 1fr}
 .board{grid-template-columns:1fr}
 .board.open .lp{display:none}
 .board:not(.open) .dp{display:none}
 .back{display:inline-grid;place-items:center}
 .list{max-height:none}
}
@media(max-width:640px){.cols{grid-template-columns:1fr}nav .hide{display:none}.m{max-width:92%}
 .party{flex-wrap:wrap}.party .acts{width:100%;justify-content:flex-start;padding-left:50px}}
</style>
</head>
<body class="wait">
<header><div class="wrap">
  <div class="brand"><a class="logo" href="index.html"><i></i>Dealr</a><span class="pill">Admin</span></div>
  <nav data-nav="admin"></nav>
</div></header>

<main class="wrap" id="main">
  <div class="top">
    <div><h1>Centre des <em>litiges.</em></h1><p class="sub" style="margin:8px 0 0">Examinez les deals bloqués, lisez la conversation, décidez où va l’argent du coffre.</p></div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><a class="btn out" href="admin-certifs.html" id="certLink">Certifications à vérifier<span class="cn" id="nCert" hidden></span></a><span class="sub" id="upd"></span></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="board" id="board">
    <section class="panel lp" aria-label="Deals">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="open" aria-selected="true">Litiges ouverts<span class="n" id="nOpen" hidden></span></button>
        <button type="button" role="tab" data-tab="resolved" aria-selected="false">Résolus</button>
        <button type="button" role="tab" data-tab="all" aria-selected="false">Tous les deals</button>
      </div>
      <label class="find"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Membre, prestation…" aria-label="Rechercher un deal"></label>
      <div class="list" id="list"></div>
    </section>
    <section class="panel dp" aria-label="Détail" aria-live="polite">
      <div class="pick" id="pick"><h2>Choisissez un <em>deal.</em></h2><p>Les litiges ouverts apparaissent en premier.</p></div>
      <div class="detail" id="detail" hidden></div>
    </section>
  </div>
</main>

<dialog id="dConf" aria-labelledby="cfT">
  <h2 id="cfT"></h2><p class="sub" id="cfP"></p><p class="err" id="cfErr" role="alert"></p>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn out" id="cfNo">Retour</button><button type="button" class="btn" id="cfOk"></button></div>
</dialog>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
var A=window.DealrAuth,$=function(i){return document.getElementById(i)};
var me=null,all=[],convs={},tab="open",sel=null,threadSig="";
var ST={proposed:"En attente de réponse",accepted:"Deal conclu",funded:"Argent au coffre",delivered:"Livré · à valider",released:"Payé",disputed:"Litige en cours",refunded:"Remboursé",declined:"Refusé",cancelled:"Annulé",countered:"Remplacé"};
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function eur(n){return A.eur(n)}
function when(s){if(!s)return"";var d=new Date(s);return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function ago(s){var m=Math.round((Date.now()-new Date(s))/60000);if(m<1)return"à l’instant";if(m<60)return"il y a "+m+" min";var hh=Math.round(m/60);if(hh<24)return"il y a "+hh+" h";return"il y a "+Math.round(hh/24)+" j"}
function initials(n){return String(n||"?").split(" ").map(function(w){return w[0]||""}).slice(0,2).join("").toUpperCase()}
function snapOf(conv,uid){if(!conv)return{id:uid,n:"Membre"};var s=conv.user_a===uid?conv.a_snap:conv.b_snap;return Object.assign({id:uid,n:"Membre"},s||{},{id:uid})}
function nameOf(d,uid){return snapOf(convs[d.conv],uid).n}
function btn(label,cls,fn){var b=h("button","btn"+(cls?" "+cls:""),label);b.type="button";b.onclick=fn;return b}

/* ---------- Chargement ---------- */
function load(){
  return A.adminDeals().then(function(ds){
    all=ds||[];
    var ids=all.map(function(d){return d.conv}).filter(function(id,i,a){return a.indexOf(id)===i&&!convs[id]});
    return Promise.all(ids.map(function(id){return A.getConversation(id).then(function(c){if(c)convs[id]=c}).catch(function(){})}));
  }).then(function(){
    renderStats();renderList();
    if(sel){var n=all.filter(function(d){return d.id===sel.id})[0];if(n){var changed=n.status!==sel.status;sel=n;if(changed)renderDetail();else loadThread()}}
    A.adminCerts().then(function(cl){var n=(cl||[]).filter(function(c){return c.status==="pending"}).length;$("nCert").textContent=n;$("nCert").hidden=!n}).catch(function(){});
    $("upd").textContent="Mis à jour à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    var latest=all.filter(function(d){return d.status==="disputed"}).map(function(d){return String(d.disputed_at||d.updated_at)}).sort().pop();
    if(latest)try{if((localStorage.getItem("dealr_admin_seen")||"")<latest)localStorage.setItem("dealr_admin_seen",latest)}catch(e){}
  })}

function renderStats(){
  var open=all.filter(function(d){return d.status==="disputed"}),vault=all.filter(function(d){return /^(funded|delivered|disputed)$/.test(d.status)}),
      paid=all.filter(function(d){return d.status==="released"}),sum=function(l){return l.reduce(function(a,d){return a+(+d.amount||0)},0)};
  var box=$("stats");box.textContent="";
  [["Litiges ouverts",String(open.length),open.length?"alert":""],["Argent bloqué en litige",eur(sum(open)),open.length?"alert":""],
   ["Argent au coffre (total)",eur(sum(vault)),""],["Deals payés",paid.length+" · "+eur(sum(paid)),""]].forEach(function(r){
    var t=h("div","stat "+r[2]);t.appendChild(h("span","sub",r[0]));t.appendChild(h("b","",r[1]));box.appendChild(t)});
  $("nOpen").textContent=open.length;$("nOpen").hidden=!open.length}

function inTab(d){
  if(tab==="open")return d.status==="disputed";
  if(tab==="resolved")return !!d.disputed_at&&(d.status==="released"||d.status==="refunded");
  return true}
function renderList(){
  var box=$("list"),q=$("q").value.toLowerCase().trim();box.textContent="";
  var l=all.filter(inTab).filter(function(d){return !q||[d.title,nameOf(d,d.payer),nameOf(d,d.payee)].join(" ").toLowerCase().indexOf(q)>=0});
  if(tab==="open")l.sort(function(a,b){return String(a.disputed_at||"").localeCompare(String(b.disputed_at||""))});
  if(!l.length){box.appendChild(h("div","empty",tab==="open"?"Aucun litige en cours. Tout va bien.":"Aucun deal ici."));return}
  l.forEach(function(d){
    var b=h("button","it");b.type="button";b.setAttribute("aria-current",sel&&sel.id===d.id?"true":"false");
    var r1=h("div","r1");r1.appendChild(h("span","st s-"+d.status,ST[d.status]||d.status));r1.appendChild(h("span","amt",eur(d.amount)));b.appendChild(r1);
    b.appendChild(h("b","",d.title));
    b.appendChild(h("div","who",nameOf(d,d.payer)+" → "+nameOf(d,d.payee)));
    b.appendChild(h("div","who",d.status==="disputed"?"Litige ouvert "+ago(d.disputed_at||d.updated_at):"Mis à jour "+ago(d.updated_at)));
    b.onclick=function(){sel=d;renderList();renderDetail();$("board").classList.add("open");window.scrollTo({top:$("board").offsetTop-10,behavior:"smooth"})};
    box.appendChild(b)})}

/* ---------- Détail d'un deal ---------- */
function partyRow(d,uid,role){
  var s=snapOf(convs[d.conv],uid),row=h("div","party"),av=h("div","av",initials(s.n)),img=A.safeImg(s.photo);
  if(img){av.textContent="";av.style.backgroundImage="url('"+img+"')"}
  var t=h("div","t");t.appendChild(h("b","",s.n));t.appendChild(h("span","sub",role+(s.job?" · "+s.job:"")));
  var acts=h("div","acts");
  var prof=h("a","btn out sm","Profil");prof.href="prestataire.html?id="+encodeURIComponent(uid);acts.appendChild(prof);
  if(uid!==me)acts.appendChild(btn("Écrire en privé","sm",function(){var b=this;b.disabled=true;
    A.openConversation(s).then(function(id){location.href="messages.html?c="+encodeURIComponent(id)}).catch(function(e){b.disabled=false;alertErr(A.message(e))})}));
  row.appendChild(av);row.appendChild(t);row.appendChild(acts);return row}
function alertErr(t){var e=$("detail").querySelector(".err.main");if(e)e.textContent=t}
function renderDetail(){
  var d=sel,box=$("detail");if(!d)return;$("pick").hidden=true;box.hidden=false;box.textContent="";threadSig="";
  var dh=h("div","dh");var bk=h("button","back","←");bk.type="button";bk.setAttribute("aria-label","Retour à la liste");
  bk.onclick=function(){$("board").classList.remove("open")};dh.appendChild(bk);
  dh.appendChild(h("span","tag","DEAL"));dh.appendChild(h("span","st s-"+d.status,ST[d.status]||d.status));box.appendChild(dh);
  box.appendChild(h("div","big",eur(d.amount)));box.appendChild(h("div","ttl",d.title));
  var meta=[];if(d.deadline)meta.push("Livraison prévue avant le "+new Date(d.deadline+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long"}));
  meta.push("Proposé par "+nameOf(d,d.proposer));box.appendChild(h("div","sub",meta.join(" · ")));
  if(d.details){var dt=h("p","sub",d.details);dt.style.cssText="white-space:pre-wrap;margin:8px 0 0";box.appendChild(dt)}

  var motif=h("div","motif");motif.id="motif";motif.hidden=true;box.appendChild(motif);

  var cols=h("div","cols"),pb=h("div","box");pb.appendChild(h("h3","","Participants"));
  pb.appendChild(partyRow(d,d.payer,"Client"));pb.appendChild(partyRow(d,d.payee,"Prestataire"));cols.appendChild(pb);
  var tb=h("div","box");tb.appendChild(h("h3","","Chronologie"));var tl=h("ol","tl");
  [["Deal proposé",d.created_at],["Accepté",d.accepted_at],["Argent au coffre",d.funded_at],["Marqué livré",d.delivered_at],["Litige ouvert",d.disputed_at,"red"],["Payé au prestataire",d.released_at],["Client remboursé",d.refunded_at]]
    .forEach(function(r){if(!r[1])return;var li=h("li",r[2]||"");li.appendChild(h("span","",r[0]));li.appendChild(h("span","",when(r[1])));tl.appendChild(li)});
  tb.appendChild(tl);cols.appendChild(tb);box.appendChild(cols);
  box.appendChild(h("p","err main"));

  /* Décision */
  if(d.status==="disputed"){
    var dec=h("div","dec");dec.appendChild(h("h3","","Votre décision"));
    dec.appendChild(h("p","sub",eur(d.amount)+" sont bloqués au coffre. Votre explication sera envoyée aux deux parties dans leur conversation."));
    var lb=h("label","","Explication de la décision");lb.htmlFor="decTx";dec.appendChild(lb);
    var tx=h("textarea");tx.id="decTx";tx.maxLength=1500;tx.placeholder="Ex. Les fichiers livrés ne correspondent pas à la commande (3 Reels prévus, 1 seul reçu). Le client est remboursé.";dec.appendChild(tx);
    var er=h("p","err");dec.appendChild(er);
    var row=h("div","row");
    row.appendChild(btn("Payer le prestataire · "+eur(d.amount),"pay",function(){decide("released",tx,er)}));
    row.appendChild(btn("Rembourser le client · "+eur(d.amount),"out",function(){decide("refunded",tx,er)}));
    dec.appendChild(row);box.appendChild(dec)}
  else if(d.status==="released"||d.status==="refunded"){
    var dn=h("div","done"+(d.status==="refunded"?" refd":""),d.status==="released"?"Paiement de "+eur(d.amount)+" versé à "+nameOf(d,d.payee)+" le "+when(d.released_at)+".":"Client ("+nameOf(d,d.payer)+") remboursé de "+eur(d.amount)+" le "+when(d.refunded_at)+".");
    box.appendChild(dn)}

  /* Écrire aux deux parties */
  var wb=h("div","box");wb.style.marginTop="16px";wb.appendChild(h("h3","","Écrire aux deux parties"));
  wb.appendChild(h("p","sub","Le message apparaît dans leur conversation, signé « Équipe Dealr »."));
  var wt=h("textarea");wt.id="postTx";wt.maxLength=2000;wt.setAttribute("aria-label","Message de l’équipe Dealr");wt.placeholder="Bonjour à tous les deux, pouvez-vous m’envoyer…";wb.appendChild(wt);
  var wok=h("p","ok"),wrow=h("div","row");
  wrow.appendChild(btn("Envoyer dans la conversation","",function(){var b=this;if(!wt.value.trim())return;b.disabled=true;wok.textContent="";
    A.adminPost(d.conv,wt.value).then(function(){wt.value="";wok.className="ok";wok.textContent="Message envoyé aux deux parties.";threadSig="";return loadThread()})
     .catch(function(e){wok.className="err";wok.textContent=A.message(e)}).then(function(){b.disabled=false})}));
  wb.appendChild(wrow);wb.appendChild(wok);box.appendChild(wb);

  /* Conversation */
  var th=h("div","thread");th.appendChild(h("h3","","Conversation du deal"));
  var lg=h("div","legend");lg.appendChild(h("span","",nameOf(d,d.payer)+" (client)"));lg.appendChild(h("span","r",nameOf(d,d.payee)+" (prestataire)"));th.appendChild(lg);
  var ms=h("div","msgs");ms.id="thr";th.appendChild(ms);box.appendChild(th);
  loadThread()}

function decide(outcome,tx,er){
  var d=sel,note=tx.value.trim();er.textContent="";
  if(note.length<10){er.textContent=A.message("admin_note");tx.focus();return}
  var to=outcome==="released"?nameOf(d,d.payee)+" (prestataire)":nameOf(d,d.payer)+" (client)";
  $("cfT").textContent=outcome==="released"?"Payer le prestataire ?":"Rembourser le client ?";
  $("cfP").textContent=eur(d.amount)+" sortiront du coffre vers "+to+". Les deux parties recevront votre explication. Cette décision est définitive.";
  $("cfOk").textContent=outcome==="released"?"Confirmer le paiement":"Confirmer le remboursement";$("cfErr").textContent="";$("cfOk").disabled=false;
  $("cfOk").onclick=function(){$("cfOk").disabled=true;
    A.resolveDispute(d,outcome,note).then(function(nd){$("dConf").close();sel=nd;return load().then(renderDetail)})
     .catch(function(e){$("cfErr").textContent=A.message(e);$("cfOk").disabled=false})};
  $("dConf").showModal()}
$("cfNo").onclick=function(){$("dConf").close()};

function loadThread(){
  var d=sel;if(!d||!$("thr"))return Promise.resolve();
  return Promise.all([A.listMessages(d.conv),A.listDeals(d.conv)]).then(function(r){
    if(!sel||sel.id!==d.id)return;var ms=r[0]||[],ds={};(r[1]||[]).forEach(function(x){ds[x.id]=x});
    var sig=ms.length+":"+(ms.length?ms[ms.length-1].id:"");if(sig===threadSig)return;threadSig=sig;
    var box=$("thr"),lastDay="",lastWho="";box.textContent="";
    if(!ms.length)box.appendChild(h("div","ev","Aucun message."));
    var reason=null;
    ms.forEach(function(m){
      var dt=new Date(m.created_at),dk=dt.toDateString();
      if(dk!==lastDay){box.appendChild(h("div","day",dt.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})));lastDay=dk;lastWho=""}
      var nm=m.sender===d.payer?nameOf(d,d.payer):m.sender===d.payee?nameOf(d,d.payee):"Équipe Dealr";
      var hm=dt.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
      if(m.kind==="admin"){var ad=h("div","adm");ad.appendChild(h("b","","Équipe Dealr · "+hm));ad.appendChild(document.createTextNode(m.text));box.appendChild(ad);lastWho="";return}
      if(m.kind==="deal"){var x=ds[m.deal],e=h("div","ev deal");e.appendChild(h("b","",nm));
        e.appendChild(document.createTextNode(" · "+m.text+(x?" · "+(ST[x.status]||x.status):"")+" · "+hm));box.appendChild(e);lastWho="";return}
      if(m.kind==="event"){var ev=h("div","ev");ev.appendChild(h("b","",nm));ev.appendChild(document.createTextNode(" · "+m.text+" · "+hm));box.appendChild(ev);lastWho="";return}
      if(/^Problème signalé/.test(m.text))reason={text:m.text.replace(/^Problème signalé\s*:\s*/,""),at:m.created_at,by:nm};
      var w=h("div","m"+(m.sender===d.payee?" r":""));
      if(lastWho!==m.sender)w.appendChild(h("small","",nm+" · "+hm));lastWho=m.sender;
      w.appendChild(h("div","bub",m.text));box.appendChild(w)});
    box.scrollTop=box.scrollHeight;
    var mo=$("motif");if(mo){mo.textContent="";
      if(reason&&(d.status==="disputed"||d.disputed_at)){mo.hidden=false;mo.appendChild(h("b","","Motif du litige · signalé par "+reason.by+" le "+when(reason.at)));mo.appendChild(h("p","",reason.text))}
      else if(d.status==="disputed"){mo.hidden=false;mo.appendChild(h("b","","Litige ouvert sans motif écrit"));mo.appendChild(h("p","","Consultez la conversation ou écrivez aux deux parties."))}}
  })}

/* ---------- Démarrage ---------- */
document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false")});renderList()}});
$("q").oninput=renderList;
var email="";
A.requireUser("admin.html").then(function(u){me=u.id;email=u.email||"";return A.isAdmin()}).then(function(ok){
  document.body.classList.remove("wait");
  if(!ok){var m=$("main");m.textContent="";var dn=h("div","denied");dn.appendChild(h("h1","","Accès réservé."));
    dn.appendChild(h("p","sub","Cette page est réservée à l’équipe Dealr."));
    var who=h("p","");who.style.margin="14px 0 0";who.appendChild(document.createTextNode("Vous êtes connecté avec "));who.appendChild(h("b","",email||"un autre compte"));
    who.appendChild(document.createTextNode(", qui n’est pas un compte administrateur."));dn.appendChild(who);
    var row=h("div","row");row.style.justifyContent="center";
    row.appendChild(btn("Se connecter en admin","",function(){A.signOut().then(function(){location.href="connexion.html?next=admin.html"})}));
    var a=h("a","btn out","Retour à l’accueil");a.href="index.html";row.appendChild(a);dn.appendChild(row);m.appendChild(dn);return}
  return load().then(function(){var first=all.filter(function(d){return d.status==="disputed"})[0];
    if(first&&window.innerWidth>980){sel=first;renderList();renderDetail()}});
}).catch(function(e){document.body.classList.remove("wait");$("main").textContent=A.message(e)});
setInterval(function(){if(document.hidden||$("dConf").open)return;var a=document.activeElement;if(a&&a.tagName==="TEXTAREA"&&a.value)return;load()},8000);
})();
</script>
</body>
</html>
