<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealr – Profil prestataire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--mute:#6b6b73;--line:#e8e8ed;--o:#f55a1f;--g:#22a863}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#fff;font:16px/1.55 Figtree,system-ui,sans-serif;
 background-image:radial-gradient(60% 40% at 100% 0,#ffe3cf 0,transparent 70%),radial-gradient(50% 40% at 0 100%,#e9ebff 0,transparent 70%);background-repeat:no-repeat}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.03em;font-weight:800;line-height:1.1}
em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:1.12em;color:var(--o)}
a{color:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-size:1.45rem;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:.62em;height:.62em;border-radius:50%;background:var(--o)}
nav{display:flex;gap:20px;font-weight:500;font-size:.95rem}
nav a{text-decoration:none;color:var(--mute)}nav a:hover{color:var(--ink)}
.btn{display:inline-block;border-radius:99px;padding:11px 22px;font:600 .95rem Figtree,sans-serif;text-decoration:none;background:var(--ink);color:#fff;border:1.5px solid var(--ink);cursor:pointer}
.btn:hover{background:#333}.btn.out{background:#fff;color:var(--ink)}.btn.out:hover{background:#f4f4f6}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:28px;align-items:start;padding:14px 0 70px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 20px 50px rgba(60,30,10,.1),0 2px 6px rgba(60,30,10,.05);margin-bottom:20px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.av{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.5rem Figtree;background:linear-gradient(135deg,#ff8a3d,var(--o));background-size:cover;background-position:center;flex:none}
h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.sub{color:var(--mute);font-size:.92rem}
.socrow{display:flex;gap:8px;margin-top:12px}
.sb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;transition:transform .2s}.sb:hover{transform:translateY(-2px)}
.sb.ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b 50%,#6228d7)}.sb.tt{background:#111}.sb.li{background:#0a66c2}.sb.ot{background:linear-gradient(135deg,#3448f0,#f55a1f)}
.sb .i{display:grid}
.ckh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ckh h2{margin:0}
.ckv{font-size:.8rem;font-weight:600;color:var(--mute);background:#f3f3f6;border-radius:99px;padding:4px 10px}
.ckl>.sub{margin:8px 0 0}
.ckrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 2px 6px;scrollbar-width:thin}
.cki{flex:0 0 250px;scroll-snap-align:start;display:flex;align-items:center;gap:12px;border:1.5px solid #e6e6ec;border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);transition:border-color .2s,transform .2s}
.cki:hover{border-color:var(--ink);transform:translateY(-2px)}
.cki.ok{background:#f3fbf6;border-color:#cdebd9;pointer-events:none}
.cic{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;color:#3448f0;background:#eef0ff}
.cki.ok .cic{color:#17613a;background:#e3f4ea}
.ckt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.ckt .sub{font-size:.84rem;line-height:1.35}
.cka{font-size:1.4rem;color:var(--mute);flex:none}.cki.ok .cka{color:#22a863;font-size:1rem;font-weight:800}
.ckf{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:.9rem}
.ckb{flex:1;max-width:220px;height:7px;border-radius:9px;background:#ececf2;overflow:hidden}.ckb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#3448f0,#f55a1f)}
.ckp{background:#fff1e8;color:#a3390f;border-radius:99px;padding:3px 10px;font-size:.85rem}
.empt{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0}
.eic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--mute);background:#f3f3f6}
.empt p{margin:0 0 6px;max-width:30em}
.certs{display:grid;gap:10px}
.cert{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px}
.vl{font-size:.85rem;font-weight:600;color:#3448f0;display:inline-block;margin-top:4px}
.cst{display:inline-block;margin-left:8px;font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 8px;vertical-align:2px}
.cst.pending{background:#fff1cc;color:#6b4a00}.cst.verified{background:#e3f4ea;color:#17613a}.cst.rejected{background:#fde8e6;color:#a1230f}
.cert.off{background:#fafafb}.rj{color:#a1230f}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.b{font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:#e6edff;color:#173ba3}
.b.e{background:#fff1cc;color:#6b4a00}.b.d{background:#e3f4ea;color:#17613a}.b.c{background:var(--ink);color:#fff}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
h2{font-size:1.3rem;margin-bottom:14px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.info div{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.info small{display:block;color:var(--mute);font-size:.8rem;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{border:1px solid #d6d6dd;border-radius:99px;padding:4px 14px;font-size:.92rem}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row b{display:block}
.pr{font-weight:700;white-space:nowrap}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:18px}
.tl>div{position:relative;margin-bottom:18px}
.tl>div:before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--o)}
.port{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.port div{aspect-ratio:1;border-radius:12px;background:#f1f1f4 center/cover}
.stars{color:#f5a623;letter-spacing:1px}
.rv{border-top:1px solid var(--line);padding:16px 0}.rv:last-child{padding-bottom:0}
.rvsum{display:flex;gap:26px;align-items:center;padding-bottom:18px;flex-wrap:wrap}
.rvscore{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:110px}
.rvscore b{font:800 2.6rem/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
.rvbars{flex:1;min-width:200px;display:grid;gap:5px;font-size:.85rem}
.rvbar{display:grid;grid-template-columns:34px 1fr 22px;align-items:center;gap:10px}
.rvbar .tr{height:7px;border-radius:9px;background:#efeff4;overflow:hidden}.rvbar .tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#f5a623,#f55a1f)}
.rst i{font-style:normal;color:#dcdce4;font-size:1.05rem;letter-spacing:1px}.rst i.on{color:#f5a623}
.rvhd{display:flex;align-items:center;gap:12px}
.rva{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem;background:linear-gradient(135deg,#3448f0,#f55a1f) center/cover}
.rvw{flex:1;min-width:0;display:flex;flex-direction:column}.rvn{font-weight:700;color:var(--ink);text-decoration:none}a.rvn:hover{text-decoration:underline}
.rvt{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:560px){.rvhd{flex-wrap:wrap}.rvhd .rst{width:100%;padding-left:52px}}
.side{position:sticky;top:16px}
.q label.it{display:grid;grid-template-columns:22px 1fr 58px;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.q label.it:first-of-type{border-top:0}
.q input[type=number],.q select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.q input[type=checkbox]{width:18px;height:18px;accent-color:var(--o);margin-top:3px}
.tot{border-top:2px solid var(--ink);margin-top:10px;padding-top:12px;display:grid;gap:6px}
.tot div{display:flex;justify-content:space-between}
.tot .big{font:800 1.4rem "Bricolage Grotesque",sans-serif}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
[hidden]{display:none!important}
.b.x{background:#f1f1f4;color:var(--mute)}
.bio{white-space:pre-line;overflow-wrap:anywhere;margin:0}
.own{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:#fff6ef;border:1px solid #ffd9bf;box-shadow:none}
.own .acts{margin-top:0}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini div{background:#f7f7f9;border-radius:14px;padding:10px 12px}
.mini b{display:block;font:800 1.3rem "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.dash .sub{font-size:.84rem}
a.todo1{display:block;text-decoration:none;margin-top:12px;border:1.5px solid #ffd2bd;background:#fff6ef;border-radius:14px;padding:10px 12px}
a.todo1 b{display:block;color:#b13d0d}
a.todo1 .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.tool{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
a.tool:hover{border-color:var(--ink)}
a.tool b{display:block}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="index.html"><i></i>Dealr</a>
<nav data-nav="profil-public"></nav></div></header>
<main class="wrap" id="app"></main>
<div id="toast" role="status"></div>
<script src="profils.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
var A=window.DealrAuth,app=document.getElementById("app");
var ICON={"ig": "<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/><circle cx=\"17.5\" cy=\"6.5\" r=\".6\" fill=\"currentColor\"/></svg>", "tt": "<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5\"/><path d=\"M14 3c.5 2.6 2.4 4.4 5 4.6\"/></svg>", "li": "<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M8 10.5V16M8 7.5v.01M12 16v-3.2a2.3 2.3 0 0 1 4.6 0V16M12 10.5V16\"/></svg>", "ot": "<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18\"/></svg>", "photo": "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><path d=\"M6.5 19a6 6 0 0 1 11 0\"/></svg>", "exp": "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2.5\"/><path d=\"M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18\"/></svg>", "edu": "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 9l10-5 10 5-10 5z\"/><path d=\"M6 11v5c3 2.5 9 2.5 12 0v-5\"/></svg>", "cert": "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"/><path d=\"M14 3v5h5M9 14l2 2 4-4\"/></svg>", "net": "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"2.5\"/><circle cx=\"18\" cy=\"6\" r=\"2.5\"/><circle cx=\"6\" cy=\"18\" r=\"2.5\"/><circle cx=\"18\" cy=\"18\" r=\"2.5\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 8l2 2M16 8l-2 2M8 16l2-2M16 16l-2-2\"/></svg>", "port": "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2.5\"/><circle cx=\"9\" cy=\"10\" r=\"2\"/><path d=\"M21 16l-5-5-9 9\"/></svg>"};
function ico(k,cls){var s=h("span",cls||"ico");s.innerHTML=ICON[k];return s}
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function eur(n){return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(n||0)}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="on";setTimeout(function(){t.className=""},2600)}
function link(txt,href,cls){var a=h("a",cls,txt);a.href=href;return a}

var id=new URLSearchParams(location.search).get("id")||"";

/* Chargement du profil : le sien (connecté), un membre (base de données) ou un exemple */
function load(){
  if(id==="moi")return A.requireUser("prestataire.html?id=moi").then(function(u){return A.isAdmin().then(function(adm){if(adm){location.replace("admin.html");return new Promise(function(){})}return u})}).then(function(u){
    return A.myProfile().then(function(p){if(!p){location.replace("profil.html");return new Promise(function(){})}return{p:p,own:true,u:u}})});
  var demo=(window.DEALR_PROS||[]).filter(function(x){return x.id===id})[0];
  if(demo)return A.user().then(function(u){return{p:Object.assign({demo:true},demo),own:false,u:u}});
  if(!A.configured||!/^[0-9a-f-]{36}$/i.test(id))return A.user().then(function(u){return{p:null,u:u}});
  return Promise.all([A.getProfile(id).catch(function(){return null}),A.user()]).then(function(r){
    return{p:r[0],u:r[1],own:!!(r[1]&&r[0]&&r[1].id===r[0].id)}});
}

load().then(function(res){
  /* Vrais avis (laissés à la fin des deals) : ils remplacent la note par défaut du profil */
  if(!res.p||res.p.demo)return res;
  /* Certifications : le membre voit toutes les siennes (avec leur statut), les autres seulement les vérifiées */
  return (res.own?A.myCerts():A.publicCerts(res.p.id)).catch(function(){return[]}).then(function(cl){res.certs=cl||[];return res}).then(function(res){
  return A.listReviews(res.p.id).then(function(rv){var st=A.summarize(rv);
    res.p.reviews=rv.map(function(r){var s=r.author_snap||{};return{note:r.rating,txt:r.text,by:s.n||"Membre",photo:s.photo,role:s.role,title:r.deal_title,date:r.created_at,author:r.author}});
    res.p.r=st.avg;res.p.a=st.n;return res},function(){res.p.reviews=[];res.p.a=0;return res})});
}).then(function(res){
var p=res.p,own=res.own,u=res.u;

if(!p){var nf=h("div","card","Ce profil est introuvable. ");nf.style.marginTop="30px";nf.appendChild(link("Retour aux prestataires","marketplace.html"));app.appendChild(nf);return}

/* Contacter : ouvre la messagerie avec ce prestataire (message pré-rempli possible) */
function contact(text){
  if(p.demo){toast("Profil d’exemple : la messagerie fonctionne avec les membres inscrits.");return}
  location.href="messages.html?with="+encodeURIComponent(p.id)+(text?"&text="+encodeURIComponent(text):"")}
var m=(p.p||"").match(/(\d[\d\s]*)\s*€\s*\/\s*(\S+)/);
var rate=+p.rate||(m?parseInt(m[1].replace(/\s/g,""),10):0),unit=p.unit||(m?m[2]:"forfait");
var UNIT={jour:"Prestation à la journée",h:"Prestation à l’heure",mission:"Prestation à la mission"};
var skills=p.skills||p.tags||[],exps=p.exps||[],langs=p.langs&&p.langs.length?p.langs:["Français"];
var services=p.services&&p.services.length?p.services:(rate?[{t:UNIT[unit]||"Prestation",d:"Selon votre besoin",price:rate,unit:unit}]:[]);
document.title="Dealr – "+(own?"Mon profil":p.n);

var layout=h("div","layout"),main=h("div","main"),side=h("aside","side");layout.appendChild(main);layout.appendChild(side);app.appendChild(layout);
function starRow(n){var s=h("span","rst");s.setAttribute("aria-label",n+" sur 5");for(var i=1;i<=5;i++)s.appendChild(h("i",i<=n?"on":"","★"));return s}
function sec(title){var c=h("section","card");c.appendChild(h("h2","",title));main.appendChild(c);return c}


/* En-tête du profil */
var hero=h("section","card"),hr=h("div","hero"),img=A.safeImg(p.photo);
var av=h("div","av",((p.n||"?").split(" ").map(function(w){return w[0]}).slice(0,2).join("")).toUpperCase());
if(img){av.textContent="";av.style.backgroundImage="url('"+img+"')"}
var tx=h("div");tx.style.flex="1";tx.appendChild(h("h1","",p.n||""));tx.appendChild(h("div","sub",p.job||""));
var bd=h("div","badges");bd.appendChild(h("span","b"+(p.t==="Entreprise"?" e":""),p.t||"Freelance"));bd.appendChild(h("span","b",p.c||""));
if(p.dispo)bd.appendChild(h("span","b d",p.dispo));if(+p.a>=5)bd.appendChild(h("span","b c","✓ Certifié"));if(p.demo)bd.appendChild(h("span","b x","Profil d’exemple"));
tx.appendChild(bd);
tx.appendChild(h("div","sub",(+p.a?"★ "+String(+p.r).replace(".",",")+" · "+(+p.a)+" avis":"Nouveau profil")+" · "+(p.city||"")));
if(own){var oa=h("div","acts");oa.appendChild(link("Modifier mon profil","profil.html","btn out"));tx.appendChild(oa)}
if(!own){var ac=h("div","acts member-only"),b1=h("button","btn","Contacter");b1.type="button";b1.onclick=function(){contact()};
  ac.appendChild(b1);ac.appendChild(link("Demander un devis","#devis","btn out"));tx.appendChild(ac)}
var SOCS=[["instagram","ig","Instagram"],["tiktok","tt","TikTok"],["linkedin","li","LinkedIn"],["other","ot","Autre réseau"]],so=p.socials||{};
var sl=SOCS.filter(function(x){return /^https:\/\/[^\s]+$/i.test(so[x[0]]||"")});
if(sl.length){var srow=h("div","socrow");sl.forEach(function(x){var a=document.createElement("a");a.href=so[x[0]];a.target="_blank";a.rel="noopener noreferrer nofollow";
  a.className="sb "+x[1];a.setAttribute("aria-label",x[2]);a.title=x[2];a.appendChild(ico(x[1],"i"));srow.appendChild(a)});tx.appendChild(srow)}
hr.appendChild(av);hr.appendChild(tx);hero.appendChild(hr);main.appendChild(hero);

/* Checklist (visible uniquement par le membre) : ce qui reste à faire pour un profil complet */
var edus=p.edus||[],certs=res.certs||[];
if(own){
  var CK=[
    {k:"photo",t:p.t==="Entreprise"?"Logo de l’entreprise":"Photo de profil",d:"Montrez aux clients qui se cache derrière votre profil.",ok:!!A.safeImg(p.photo),go:1},
    {k:"exp",t:"Expériences",d:"Ajoutez au moins 2 expériences pour rassurer les clients.",ok:exps.length>=2,go:4},
    {k:"edu",t:"Formation",d:"Vos diplômes et formations prouvent vos connaissances.",ok:edus.length>0,go:5},
